# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@relay-harness/rlh-system-prompt'

- id: tools
  name: '@relay-harness/rlh-tools'

- id: subprocess
  name: '@relay-harness/rlh-subprocess-local'

- id: bash
  name: '@relay-harness/rlh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@relay-harness/rlh-shell-env'

- id: tasks
  name: '@relay-harness/rlh-jobs-local'

- id: tool-jobs
  name: '@relay-harness/rlh-tool-jobs'

- id: tool-pwsh
  name: '@relay-harness/rlh-tool-pwsh'
