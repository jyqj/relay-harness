# Keyless real-Loader composition for workspace-instruction resume
# reconciliation. The test seeds one persisted baseline, changes AGENTS.md
# while the session is offline, then resumes through the public agent service.

- id: persistence
  name: '@relay-harness/rlh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@relay-harness/rlh-llm-replay'
  config:
    file: !!js process.env.RLH_SNAPSHOT_FILE
    overrideFile: !!js process.env.RLH_SNAPSHOT_OVERRIDE

- id: fs-local
  name: '@relay-harness/rlh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: agent
  name: '@relay-harness/rlh-agent-spine-demo'
  config:
    agents: []
    workspaceContext:
      maxBytes: 65536
      rlhHome: !!js process.cwd() + '/.rlh'
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

# Await the persisted resume before the headless driver inspects root agents.
- id: resumed-agent
  name: './tests/fixtures/workspace-context-resume-agent.ts'
