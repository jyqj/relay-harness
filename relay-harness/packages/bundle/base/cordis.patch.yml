# The rlh-base bundle patch: the shared core of every rlh profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: timer
      name: '@relay-harness/cordis-plugin-timer'

    - id: hmr
      name: '@relay-harness/cordis-plugin-hmr'
      config:
        root: ['.']

    - id: llm
      name: '@relay-harness/rlh-llm'

    - id: session
      name: '@relay-harness/rlh-session'

    # One host-owned Context Control Plane serves every surface, including
    # headless/CLI Agent sessions. Providers contribute through this registry;
    # AgentLoop supplies durable caller identity on every preparation.
    - id: context-engine
      name: '@relay-harness/rlh-context-engine'
      config:
        maxChars: 64000
        maxTokens: 16000
        maxContributorChars: 64000
        maxContributorTokens: 16000
        contributorTimeoutMs: 5000

    # One protocol-native registry for MCP Resources and Prompts. Individual
    # mcp-client rows publish generations here; Resources enter ContextEngine,
    # while Prompts remain an explicit catalog/invocation seam.
    - id: mcp-catalog
      name: '@relay-harness/rlh-mcp-catalog'

    # Prompt Enhancement history is a Context Provider, not a private composer.
    # It is host-owned and declines ordinary agent_step requests, so the base
    # can compose it once without duplicating AgentLoop's normal transcript.
    - id: session-history-context
      name: '@relay-harness/rlh-session-history-context'
      config:
        maxExchanges: 12
        maxChars: 24000
        maxTokens: 6000

    - id: typert
      name: '@relay-harness/rlh-typert-registry'

    - id: typert-loader
      name: '@relay-harness/rlh-typert-loader'

    - id: typert-gateway
      name: '@relay-harness/rlh-api-gateway'

    - id: session-title
      name: '@relay-harness/rlh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@relay-harness/rlh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: '@relay-harness/rlh-user-questions'

    - id: agent
      name: '@relay-harness/rlh-agent'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@relay-harness/rlh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

    - id: jobs
      name: '@relay-harness/rlh-jobs-local'

    - id: llm-retry
      name: '@relay-harness/rlh-llm-retry'

    # Designated vision model for text-only main models: the Models page
    # stores the route in the `vision-fallback` settings namespace; unset
    # means disabled and image prompts to text-only models stay refused.
    - id: llm-vision-fallback
      name: '@relay-harness/rlh-llm-vision-fallback'
      config:
        maxOutputTokens: 2048
        timeoutMs: 120000

    # User-settings document (`$RLH_HOME/settings.yaml`, hot-reloaded): a
    # `llm-deepseek:` or `llm-pi-ai:` section there overrides the adapter entries
    # below without a restart, and is what the web Models page writes.
    - id: settings
      name: '@relay-harness/rlh-settings-file'

    - id: product-mode
      name: '@relay-harness/rlh-host-product-mode'

    # Credential sources: inherited environment over the managed
    # `$RLH_HOME/.credentials.yaml`, with project and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: credentials
      name: '@relay-harness/rlh-credentials-local'
      config:
        # Desktop passes only this path. The provider imports the legacy apiKey
        # once into `.credentials.yaml` and scrubs it from the JSON source.
        legacyDesktopJsonPath: !!js process.env.RLH_DESKTOP_LEGACY_CREDENTIALS_PATH

    # The pi-ai multi-provider twin, mounted dormant: zero routes (and no extra
    # models in the picker) until a `llm-pi-ai:` settings section supplies provider
    # profiles — then those routes register live, keys resolving per request
    # through their apiKeyEnv references, and drop again when the section empties.
    # Supplying those profiles is exactly what the web Models page does. Which
    # adapters exist is composition; which providers run is the user's settings
    # document.
    - id: llm-pi-ai
      name: '@relay-harness/rlh-llm-pi-ai'

    - id: session-persistence-jsonl
      name: '@relay-harness/rlh-session-persistence-jsonl'
      config:
        root: !!js rlhHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@relay-harness/rlh-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@relay-harness/rlh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Canonical long-term memory is separate from the append-only session log:
    # revisions and governance decisions live here, while every source keeps
    # exact SessionEvent evidence. Agent presets choose whether to consume it.
    - id: memory-sqlite
      name: '@relay-harness/rlh-memory-sqlite'
      config:
        path: !!js rlhHomePath('memory/memory.db')

    # Memory is a host Context Provider rather than an independent pre-step
    # injector. The durable preset gate keeps minimal sessions memory-free while
    # Agent steps and Prompt Enhancement share the same retrieval/provenance path.
    - id: memory-agent
      name: '@relay-harness/rlh-memory-agent'
      config:
        userId: !!js process.env.USER || process.env.USERNAME || 'local'
        agentId: relay-harness
        agentPresets: [standard]
        candidateLimit: 10
        maxContextChars: 3200

    # Automatic extraction is package-default off. The shipped standard
    # profile explicitly enables one host worker and restricts capture to
    # sessions whose durable preset identity is `standard`.
    - id: memory-extractor-llm
      name: '@relay-harness/rlh-memory-extractor-llm'
      config:
        enabled: true
        userId: !!js process.env.USER || process.env.USERNAME || 'local'
        agentId: relay-harness
        agentPresets: [standard]
        includeSubagents: false
        maxInputChars: 16000
        maxSourceChars: 4000
        maxCandidates: 5
        maxCandidateContentChars: 2000
        maxCandidateSummaryChars: 300
        maxOutputTokens: 1200
        timeoutMs: 60000
        maxAttempts: 3
        leaseMs: 120000
        retryDelayMs: 5000
        pollMs: 1000

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: session-projection
      name: '@relay-harness/rlh-session-projection'

    # Session telemetry is mounted but disabled by default. RLH_TELEMETRY_MODE
    # explicitly opts into FULL or FEEDBACK_ONLY reporting; uploading mirrors
    # session-log records onto OTLP/HTTP logs with no session-telemetry/record redaction
    # rule, so exports are the raw captured copy. The deployment stance, env
    # seams, and follow-ups are pinned in the default-off Agent Note.
    # RLH_TELEMETRY_OTLP_URL names the collector endpoint; no endpoint is
    # built in, so an uploading mode without it fails at plugin load instead
    # of exporting anywhere implicit. A non-empty
    # RLH_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out (the launchers patch the row disabled; config cannot disable
    # a row). Exports carry the harness home's anonymous user id ($RLH_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. The exporter/processor values normally bound the shutdown drain
    # to ~1s against an unreachable collector: exporter.timeoutMillis is both
    # the per-attempt socket timeout and the retry deadline (1s effectively
    # disables the SDK's 5-try backoff), while maxExportBatchSize == maxQueueSize
    # (both explicit) makes the drain a single batch. The SDK awaits
    # exporter.forceFlush() outside exportTimeoutMillis, so the backend's 3s
    # shutdownTimeoutMillis is the load-bearing outer bound when a transport
    # promise never settles. Every CLI exit path drains it by disposing the root
    # on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: '@relay-harness/rlh-session-telemetry-otel'
      config:
        mode: !!js process.env.RLH_TELEMETRY_MODE || 'DISABLED'
        shutdownTimeoutMillis: 3000
        exporter:
          url: !!js process.env.RLH_TELEMETRY_OTLP_URL
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@relay-harness/rlh-subprocess-local'

    # Every shipped CLI mode starts with full file access. The environment
    # remains an explicit deployment override for installations that opt into a
    # narrower policy.
    - id: sandbox
      name: '@relay-harness/rlh-sandbox-local'

    - id: sandbox-policy
      name: '@relay-harness/rlh-sandbox-policy'
      config:
        mode: !!js process.env.RLH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@relay-harness/rlh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@relay-harness/rlh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@relay-harness/rlh-user-approval'
      config:
        policy: !!js "(process.env.RLH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@relay-harness/rlh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            name: Standard
            description: Write inside the current workspace; ask before higher-impact access.
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            name: Developer Mode
            description: Unrestricted host access without approval prompts.
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@relay-harness/rlh-shell-env'

    - id: tool-bash
      name: '@relay-harness/rlh-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@relay-harness/rlh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@relay-harness/rlh-tool-jobs'

    - id: fs-observation-policy
      name: '@relay-harness/rlh-fs-observation-policy'

    - id: tool-fs
      name: '@relay-harness/rlh-tool-fs'

    - id: tool-fs-search
      name: '@relay-harness/rlh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@relay-harness/rlh-agent-instructions'
      config:
        maxBytes: 65536

    - id: mcp-servers-file
      name: '@relay-harness/rlh-mcp-servers-file'

    - id: skill
      name: '@relay-harness/rlh-skill'

    - id: skill-filesystem
      name: '@relay-harness/rlh-skill-filesystem'

    - id: skill-badge
      name: '@relay-harness/rlh-skill-badge'
      disabled: true

    - id: tool-skill
      name: '@relay-harness/rlh-tool-skill'

    - id: commands
      name: '@relay-harness/rlh-commands'

    - id: command-feedback
      name: '@relay-harness/rlh-command-feedback'

    - id: goal
      name: '@relay-harness/rlh-goal'

    - id: goal-round-driver
      name: '@relay-harness/rlh-goal-round-driver'

    - id: command-goal
      name: '@relay-harness/rlh-command-goal'

    - id: plan-mode
      name: '@relay-harness/rlh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@relay-harness/rlh-token-meter'

    - id: compaction-basic
      name: '@relay-harness/rlh-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@relay-harness/rlh-command-compact'

    - id: subagent
      name: '@relay-harness/rlh-subagent'
      config:
        # Codex multi-agent v2's default concurrent thread ceiling is four.
        # Apply that prior-art bound to the complete RLH root subagent tree.
        maxActivePerRoot: 4
        overflow: reject
        # One durable owner/fence per continuable child across Harness processes.
        activationLeasePath: !!js ctx.rlhHomePath('subagent-activation-leases.sqlite3')
        activationLeaseMs: 30000
        activationLeaseRenewMs: 10000

    - id: subagent-spawn-in-process
      name: '@relay-harness/rlh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@relay-harness/rlh-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@relay-harness/rlh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@relay-harness/rlh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@relay-harness/rlh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # Fork stays one-shot: a continuable child's `report` tool and prompt
    # section precede the inherited history a fork exists to reuse; one-shot
    # fork children install neither, keeping the parent's request prefix.
    # See .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@relay-harness/rlh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    # Optional direct-child return channel; absent from roots and one-shot agents.
    - id: tool-subagent-report
      name: '@relay-harness/rlh-tool-subagent-report'

    # The engine serves the fixed deployment-owned Ralph script. The arbitrary
    # model-written workflow Consumer is intentionally absent from this bundle.
    - id: workflow-worker-thread
      name: '@relay-harness/rlh-workflow-worker-thread'
      config:
        provider: spawn

    - id: timeout-policy
      name: '@relay-harness/rlh-tool-call-timeout-policy'

    - id: spill-local
      name: '@relay-harness/rlh-spill-local'

    - id: spill-policy
      name: '@relay-harness/rlh-spill-policy'
      config:
        maxInlineBytes: 50000

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@relay-harness/rlh-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@relay-harness/rlh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@relay-harness/rlh-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@relay-harness/rlh-tool-goal'

    # Fresh-agent Ralph iteration over a build-time-fixed script.
    - id: tool-ralph
      name: '@relay-harness/rlh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    - id: tool-str-replace-editor
      name: '@relay-harness/rlh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@relay-harness/rlh-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # Stop-boundary corrections for empty answers, unexecuted code blocks,
    # and unverified completion claims.
    - id: behavior-correction
      name: '@relay-harness/rlh-behavior-correction'

    # Continue nudges when a turn closes on a max-tokens cutoff.
    - id: token-budget-controller
      name: '@relay-harness/rlh-token-budget-controller'

    # Every mode enables the stable model-facing web_search tool. DeepSeek search
    # resolves the same DEEPSEEK_API_KEY credential the Models page manages for
    # chat, at each search; its Messages endpoint is separate from the
    # chat-completions endpoint, so it takes its own base-URL override. Fetch stays
    # disabled and no fetch provider is mounted: that provider defers SSRF
    # protection and the model would choose the request target. Search is a full
    # auxiliary model request with server-side retrieval, so this shipped DeepSeek
    # route gets 60s while the provider-neutral tool default remains 30s.
    - id: web
      name: '@relay-harness/rlh-web'
      config:
        searchProvider: deepseek-official

    - id: web-search-deepseek
      name: '@relay-harness/rlh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: tool-web
      name: '@relay-harness/rlh-tool-web'
      config:
        fetch: false
        searchTimeoutMs: 60000

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: '@relay-harness/rlh-tools'

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@relay-harness/rlh-system-prompt'
      config:
        persona: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@relay-harness/rlh-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@relay-harness/rlh-fs-sandbox'

    # The native DeepSeek adapter. No key or endpoint is inlined: both resolve per
    # request from the `llm-deepseek:` settings section over this entry, with the
    # key coming from the credential store below. Thinking defaults are a deployment
    # choice.
    - id: llm-deepseek
      name: '@relay-harness/rlh-llm-deepseek'
