name: Renewal workspace transfer
on:
  push:
    branches: [feat/architecture-renewal-integrated]
    paths: [.github/workflows/renewal-workspace-transfer.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ffe9921273a87d763708a56eaa44202ad9d5fbaf
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay-harness/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: relay-harness
        run: pnpm install --frozen-lockfile
      - name: Package source and runtime dependencies only
        run: |
          mkdir -p "$RUNNER_TEMP/renewal-export" "$RUNNER_TEMP/renewal-parts"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/renewal-export/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/renewal-export/source.commit"
          find relay-harness -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/dependency-paths"
          tar --null -T "$RUNNER_TEMP/dependency-paths" -czf "$RUNNER_TEMP/dependencies.tar.gz"
          cp "$(command -v node)" "$RUNNER_TEMP/renewal-export/node"
          pnpm_root="$(dirname "$(dirname "$(readlink -f "$(command -v pnpm)")")")"
          tar -C "$pnpm_root" -czf "$RUNNER_TEMP/renewal-export/pnpm.tar.gz" .
          split -b 250M "$RUNNER_TEMP/dependencies.tar.gz" "$RUNNER_TEMP/renewal-parts/dependencies.part-"
          cd "$RUNNER_TEMP/renewal-export"
          sha256sum source.tar.gz node pnpm.tar.gz > SHA256SUMS
          cd "$RUNNER_TEMP/renewal-parts"
          sha256sum dependencies.part-* > "$RUNNER_TEMP/renewal-export/dependencies.SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-source-${{ github.run_id }}
          path: ${{ runner.temp }}/renewal-export/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-deps-a-${{ github.run_id }}
          path: ${{ runner.temp }}/renewal-parts/dependencies.part-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-deps-b-${{ github.run_id }}
          path: ${{ runner.temp }}/renewal-parts/dependencies.part-ab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-deps-c-${{ github.run_id }}
          path: ${{ runner.temp }}/renewal-parts/dependencies.part-ac
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
