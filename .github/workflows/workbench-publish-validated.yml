name: Publish validated workbench sources

on:
  push:
    branches: ['feat/workbench-frontend-restructure']
    paths: ['.github/workflows/workbench-publish-validated.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply the locally validated source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/workbench-frontend-restructure'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 829904fdaee2027521fff1de6e142b34827fd3fe HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          parts = [pathlib.Path(f'.github/workbench-transfer/part{i}.b64').read_text().strip() for i in range(1, 5)]
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '72d6b883d96ba8a7063f03d5228e32b61c553893f596ebd8cdc50388d558f9f7', 'Source patch digest mismatch'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'workbench.patch'
          path.write_bytes(patch)
          stats = subprocess.check_output(['git', 'apply', '--numstat', '--unidiff-zero', str(path)], text=True)
          for line in stats.splitlines():
              name = line.split('\t', 2)[2]
              assert name.startswith('relay-harness/'), name
              assert all(part not in ('.git', '..') for part in pathlib.PurePosixPath(name).parts), name
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(path)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(path)], check=True)
          print('Applied SHA256-verified source patch.')
          PY
      - name: Remove temporary transfer facilities and publish only this branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workbench-transfer/part1.b64 .github/workbench-transfer/part2.b64 .github/workbench-transfer/part3.b64 .github/workbench-transfer/part4.b64
          git rm .github/workflows/workbench-offline-validation.yml .github/workflows/workbench-publish-validated.yml
          git add relay-harness
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(client): introduce main workbench and authoritative record review'
          test "$(git ls-remote origin refs/heads/feat/workbench-frontend-restructure | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/workbench-frontend-restructure
