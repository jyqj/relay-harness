name: Main workbench

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-frontend.yml'
      - 'relay-harness/packages/client/**'
      - 'relay-harness/packages/host/work-results/**'
      - 'relay-harness/packages/api/**'
      - 'relay-harness/packages/bundle/base/**'
      - 'relay-harness/apps/web/tests/**'
      - 'relay-harness/package.json'
      - 'relay-harness/pnpm-lock.yaml'
      - 'relay-harness/tsconfig*.json'
      - 'relay-harness/vitest*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-workbench-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: relay-harness

env:
  RLH_TELEMETRY_DISABLED: '1'
  RLH_OXLINT_THREADS: '2'
  NODE_OPTIONS: '--max-old-space-size=5120'

jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay-harness/package.json
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run workbench and adjacent regressions
        run: >-
          pnpm exec vitest run
          packages/client/ui-layout/tests
          packages/client/ui-sidebar/tests
          packages/client/ui-product-shell/tests
          packages/client/ui-surfaces/tests
          packages/client/ui-permission-presets/tests
          packages/host/work-results/tests
          packages/client/ui-renderer/tests
      - name: Typecheck and build Host
        run: |
          pnpm exec tsc -b tsconfig.host.json
          node node_modules/tsdown/dist/run.mjs --config-loader native --env.RLH_BUILD_FACE host
      - name: Typecheck and build Client
        run: |
          pnpm exec tsc -b tsconfig.client.json
          node node_modules/tsdown/dist/run.mjs --config-loader native --env.RLH_BUILD_FACE client
          node packages/client/ui-user-terminal/scripts/copy-ghostty-assets.mjs
          pnpm run build:web
          node --import tsx/esm --input-type=module -e "import { writeClientBuildRecord, resolveClientBuildEnvironment } from './scripts/client-build-environment.ts'; writeClientBuildRecord(process.cwd(), resolveClientBuildEnvironment(process.env))"
      - name: Install pinned Chromium
        run: pnpm --filter @relay-harness/rlh-web-frontend exec playwright install --with-deps chromium
      - name: Exercise assembled navigation, drafts, source identity, and confirmation
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/work-inventory.e2e.ts
      - name: Lint changed feature packages
        if: ${{ !cancelled() }}
        run: >-
          node --import tsx/esm scripts/run-oxlint.ts
          packages/client/ui-layout
          packages/client/ui-sidebar
          packages/client/ui-product-shell
          packages/client/ui-surfaces
          packages/client/ui-permission-presets
          packages/host/work-results
      - name: Upload workbench browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: workbench-browser-${{ github.run_id }}
          path: relay-harness/test-results/
          if-no-files-found: ignore
          retention-days: 7
