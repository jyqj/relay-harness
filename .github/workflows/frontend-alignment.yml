name: Frontend alignment

on:
  pull_request:
    paths:
      - '.github/workflows/frontend-alignment.yml'
      - 'relay-harness/packages/client/**'
      - 'relay-harness/packages/host/work-results/**'
      - 'relay-harness/packages/api/**'
      - 'relay-harness/package.json'
      - 'relay-harness/pnpm-lock.yaml'
      - 'relay-harness/vitest*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-alignment-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: relay-harness

env:
  RLH_TELEMETRY_DISABLED: '1'

jobs:
  product-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export tracked sources for offline validation
        working-directory: .
        run: git archive --format=tar.gz --output="${{ runner.temp }}/frontend-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-source-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay-harness/package.json
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run product shell regressions
        run: pnpm exec vitest run packages/client/ui-product-shell/tests
