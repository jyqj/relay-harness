name: Context development snapshot
on:
  push:
    branches: [feat/native-context-tool-first]
    paths: [.github/workflows/context-development-bootstrap.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RLH_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked development dependencies
        working-directory: relay-harness
        run: |
          pnpm install --frozen-lockfile
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pnpm-workspace.yaml')
          p.write_text(p.read_text().replace('allowBuilds:\n', 'allowBuilds:\n  # LanceDB storage never invokes its optional HuggingFace model adapters.\n  onnxruntime-node: false\n  sharp: false\n'))
          PY
          pnpm --filter @relay-harness/rlh-code-index-local add --save-exact @lancedb/lancedb@0.38.0 apache-arrow@18.1.0
      - name: Package keyless development dependencies and history
        run: |
          mkdir -p /tmp/context-development-runtime
          cp "$(command -v node)" /tmp/context-development-runtime/node
          cp -a "$(dirname "$(dirname "$(realpath "$(command -v pnpm)")")")" /tmp/context-development-runtime/pnpm-package
          git bundle create /tmp/context-development-history.bundle --all
          find relay-harness -type d -name node_modules -prune -print0 > /tmp/dependency-paths
          printf '%s\0' relay-harness/pnpm-lock.yaml relay-harness/pnpm-workspace.yaml relay-harness/packages/index/code-index-local/package.json >> /tmp/dependency-paths
          tar --null -T /tmp/dependency-paths -czf /tmp/context-development-dependencies.tgz
          tar -czf /tmp/context-development-runtime.tgz -C /tmp/context-development-runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: context-development-dependencies
          path: |
            /tmp/context-development-dependencies.tgz
            /tmp/context-development-runtime.tgz
            /tmp/context-development-history.bundle
          retention-days: 1
          compression-level: 0
