name: Context development snapshot
on:
  push:
    branches: [feat/native-context-tool-first]
    paths: [.github/workflows/context-development-bootstrap.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RLH_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned dependencies and record additions
        working-directory: relay-harness
        run: |
          pnpm install --frozen-lockfile
          find node_modules/.pnpm -mindepth 1 -maxdepth 1 -type d | sort > /tmp/dependencies-before
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pnpm-workspace.yaml')
          p.write_text(p.read_text().replace('allowBuilds:\n', 'allowBuilds:\n  # LanceDB storage never invokes its optional HuggingFace model adapters.\n  onnxruntime-node: false\n  sharp: false\n'))
          PY
          pnpm --filter @relay-harness/rlh-code-index-local add --save-exact @lancedb/lancedb@0.38.0 apache-arrow@18.1.0
          find node_modules/.pnpm -mindepth 1 -maxdepth 1 -type d | sort > /tmp/dependencies-after
          comm -13 /tmp/dependencies-before /tmp/dependencies-after > /tmp/dependencies-added
          printf '%s\n' node_modules/.pnpm/node_modules packages/index/code-index-local/node_modules pnpm-lock.yaml pnpm-workspace.yaml packages/index/code-index-local/package.json >> /tmp/dependencies-added
          tar -T /tmp/dependencies-added -czf /tmp/context-vector-additions.tgz
      - name: Package keyless compact tooling and history
        run: |
          mkdir -p /tmp/context-development-runtime
          cp "$(command -v node)" /tmp/context-development-runtime/node
          cp -aL "$PNPM_HOME/../pnpm" /tmp/context-development-runtime/pnpm-package
          git bundle create /tmp/context-development-history.bundle --all
          tar -czf /tmp/context-development-runtime.tgz -C /tmp/context-development-runtime .
          ls -lh /tmp/context-*
      - uses: actions/upload-artifact@v4
        with:
          name: context-vector-additions
          path: /tmp/context-vector-additions.tgz
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: context-development-tooling
          path: |
            /tmp/context-development-runtime.tgz
            /tmp/context-development-history.bundle
          retention-days: 1
          compression-level: 0
