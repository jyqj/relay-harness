name: Architecture renewal

on:
  push:
    branches: [feat/architecture-renewal-20260919]

permissions:
  contents: read
  actions: read

concurrency:
  group: architecture-renewal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: renewal-tools-35423746277
          run-id: 35423746277
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/renewal-tools
      - name: Split locked dependencies into bounded artifacts
        run: |
          cd "$RUNNER_TEMP/renewal-tools"
          split -b 350M -d -a 2 relay-renewal-dependencies.tar.gz deps-
          sha256sum relay-renewal-*.tar.gz deps-* > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-runtime-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/renewal-tools/relay-renewal-node.tar.gz
            ${{ runner.temp }}/renewal-tools/relay-renewal-pnpm.tar.gz
            ${{ runner.temp }}/renewal-tools/checksums.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-deps-00-${{ github.run_id }}
          path: ${{ runner.temp }}/renewal-tools/deps-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-deps-01-${{ github.run_id }}
          path: ${{ runner.temp }}/renewal-tools/deps-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-deps-02-${{ github.run_id }}
          path: ${{ runner.temp }}/renewal-tools/deps-02
          compression-level: 0
          retention-days: 1
