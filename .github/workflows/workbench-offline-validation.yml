name: Workbench validation inputs

on:
  push:
    branches: ['feat/workbench-frontend-restructure']
    paths: ['.github/workflows/workbench-offline-validation.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: relay-harness

env:
  RLH_TELEMETRY_DISABLED: '1'

jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive only tracked public source
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/relay-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-source
          path: ${{ runner.temp }}/relay-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay-harness/package.json
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install locked validation dependencies
        run: pnpm install --frozen-lockfile
      - name: Archive installed dependencies and Node, never credentials or Git configuration
        run: |
          find . -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/relay-dependency-paths"
          tar --null -T "$RUNNER_TEMP/relay-dependency-paths" -czf "$RUNNER_TEMP/relay-dependencies.tar.gz"
          cp "$(command -v node)" "$RUNNER_TEMP/relay-node"
      - uses: actions/upload-artifact@v7
        with:
          name: workbench-toolchain
          path: |
            ${{ runner.temp }}/relay-dependencies.tar.gz
            ${{ runner.temp }}/relay-node
          retention-days: 1
